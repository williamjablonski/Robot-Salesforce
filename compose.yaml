services:
  tests:
    build: .
    image: robot-salesforce-tests:local
    init: true
    shm_size: 2gb
    environment:
      SF_LOGIN_URL: ${SF_LOGIN_URL:-https://test.salesforce.com}
      SF_LIGHTNING_URL: ${SF_LIGHTNING_URL:-https://YOUR-DOMAIN.lightning.force.com}
      SF_USERNAME: ${SF_USERNAME:-}
      SF_PASSWORD: ${SF_PASSWORD:-}
      SF_BROWSER: ${SF_BROWSER:-chrome}
    volumes:
      - ./results:/app/results
    command: ["tests/"]
