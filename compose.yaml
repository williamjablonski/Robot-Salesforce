services:
  tests:
    image: ${ROBOT_TEST_IMAGE:-williamjablonski/robot-salesforce-tests:latest}
    pull_policy: ${ROBOT_TEST_PULL_POLICY:-always}
    init: true
    shm_size: 2gb
    environment:
      SF_LOGIN_URL: ${SF_LOGIN_URL:-https://q4sureplatform.my.salesforce.com}
      SF_LIGHTNING_URL: ${SF_LIGHTNING_URL:-https://YOUR-DOMAIN.lightning.force.com}
      SF_USERNAME: ${SF_USERNAME:-}
      SF_PASSWORD: ${SF_PASSWORD:-}
      SF_BROWSER: ${SF_BROWSER:-chrome}
      SF_OPPORTUNITY_STAGE: ${SF_OPPORTUNITY_STAGE:-}
      SF_OPPORTUNITY_CLOSE_DATE: ${SF_OPPORTUNITY_CLOSE_DATE:-}
      SF_ORDER_ACCOUNT_NAME: ${SF_ORDER_ACCOUNT_NAME:-}
      SF_ORDER_EFFECTIVE_DATE: ${SF_ORDER_EFFECTIVE_DATE:-}
      SF_ORDER_STATUS: ${SF_ORDER_STATUS:-}
    volumes:
      - ./reports:/app/reports
      - ./tests:/app/tests:ro
      - ./libraries:/app/libraries:ro
      - ./resources:/app/resources:ro
      - ./data:/app/data:ro
    command: ["--outputdir", "/app/reports", "tests/"]
